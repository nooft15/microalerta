<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MicroAlerta</title>
  <meta name="description" content="Monitoreo ciudadano de partículas tipo microplástico en el aire del Desierto de Atacama (Copiapó) con ciencia escolar, fotos y autocuidado.">
  <meta name="theme-color" content="#15181B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="banner" class="banner hidden" role="status"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">µ<span>A</span></div>
      <div class="brand-txt">
        <h1>MicroAlerta</h1>
        <p id="subtitle">Partículas tipo microplástico en el aire · Atacama</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btnSettings" class="chip chip-icon" title="Ajustes y unidades" onclick="location.hash='#/settings'">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 .06-1 7.6 7.6 0 0 0-.06-1l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.73-1l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.62.26-1.2.59-1.73 1l-2.39-.96a.5.5 0 0 0-.6.22L2.65 7.78a.5.5 0 0 0 .12.64L4.8 10a7.6 7.6 0 0 0 0 2l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.6.22l2.39-.96c.53.41 1.11.74 1.73 1l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7.3 7.3 0 0 0 1.73-1l2.39.96c.2.1.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13Zm-7.4 2.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/></svg>
      </button>
      <button id="btnUser" class="chip" title="Mi cuenta" onclick="location.hash='#/profile'">Cuenta</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div id="semInfo" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="semInfoTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="semInfoTitle">Escala de partículas y recomendaciones</h2>
        <button type="button" class="modal-close" data-sem-info-close aria-label="Cerrar">&times;</button>
      </div>
      <p class="modal-intro">Cada color indica la concentración de partículas potencialmente
        plásticas en el agua de la placa (part./mL) y las acciones de autocuidado para ese nivel.</p>
      <div id="semInfoBody"></div>
    </div>
  </div>

  <nav class="tabbar" id="nav">
    <button data-view="home" class="tab active"><span>Inicio</span></button>
    <button data-view="panel" class="tab"><span>Panel</span></button>
    <button data-view="report" class="tab"><span>Reportar</span></button>
    <button data-view="map" class="tab"><span>Mapa</span></button>
    <button data-view="weather" class="tab"><span>Clima</span></button>
    <button data-view="protocol" class="tab"><span>Protocolo</span></button>
    <button data-view="selfcare" class="tab"><span>Autocuidado</span></button>
    <button data-view="admin" class="tab hidden" id="tabAdmin"><span>Admin</span></button>
    <button data-view="profile" class="tab"><span>Perfil</span></button>
  </nav>

  <script src="/static/js/app.js"></script>
</body>
</html>
